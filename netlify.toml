[build]
  publish = "."
  command = "echo 'Static site — no build step'"

# Cross-origin isolation for SharedArrayBuffer (WASM threading)
# Using 'credentialless' to allow cross-origin CDN/model loads
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "credentialless"

# Cache reference images and JS aggressively
[[headers]]
  for = "/references/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Ensure correct MIME types for JS modules
[[headers]]
  for = "*.js"
  [headers.values]
    Content-Type = "application/javascript"

# Proxy model downloads through Netlify to avoid CORS issues with GitHub Releases
# Models are cached in IndexedDB after first download, so bandwidth usage is one-time per user
[[redirects]]
  from = "/models-cdn/*"
  to = "https://github.com/alphastack1/storage/releases/download/newface-v1/:splat"
  status = 200
  force = true

# Redirect www to apex
[[redirects]]
  from = "https://www.newface.live/*"
  to = "https://newface.live/:splat"
  status = 301
  force = true
