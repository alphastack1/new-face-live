[build]
  publish = "."
  command = "echo 'Static site — no build step'"

# Cross-origin isolation for SharedArrayBuffer (WASM threading)
# Using 'credentialless' to allow cross-origin CDN/model loads
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "credentialless"

# Cache reference images and JS aggressively
[[headers]]
  for = "/references/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Ensure correct MIME types for JS modules
[[headers]]
  for = "*.js"
  [headers.values]
    Content-Type = "application/javascript"

# Model downloads proxied by edge function (netlify/edge-functions/models-proxy.js)
# Edge function follows GitHub's 302 redirects server-side and adds CORS headers

# Redirect www to apex
[[redirects]]
  from = "https://www.newface.live/*"
  to = "https://newface.live/:splat"
  status = 301
  force = true
